definitions:
  scripts:
    - &install_dependencies
      name: Install dependencies
      script: flutter pub get

    - &build_android_apk
      name: Build Android APK
      script: |
        flutter build apk --release
        mv build/app/outputs/flutter-apk/app-release.apk output/AccionGPS-Manager.apk

    - &build_android_aab
      name: Build Android AAB
      script: |
        flutter build appbundle --release
        mv build/app/outputs/bundle/release/app-release.aab output/AccionGPS-Manager.aab

    - &build_ios
      name: Build iOS IPA
      script: flutter build ipa --release --no-codesign

  artifacts:
    - output/AccionGPS-Manager.apk
    - output/AccionGPS-Manager.aab

workflows:
  android-release:
    name: Android Release (APK + AAB)
    instance_type: linux
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - mkdir -p output
      - *install_dependencies
      - *build_android_apk
      - *build_android_aab
    artifacts:
      - output/AccionGPS-Manager.apk
      - output/AccionGPS-Manager.aab

  ios-release:
    name: iOS Release (IPA)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - mkdir -p output
      - *install_dependencies
      - *build_ios
    artifacts:
      - build/ios/ipa/*.ipa

  ios-upload:
    name: iOS Upload to App Store
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      groups:
        - app_store_connect
        - ios_signing
    scripts:
      - mkdir -p output
      - *install_dependencies
      - *build_ios
    artifacts:
      - build/ios/ipa/*.ipa
