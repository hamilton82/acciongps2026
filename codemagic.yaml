definitions:
  scripts:
    - &install_dependencies
      name: Install dependencies
      script: flutter pub get

    - &build_android_apk
      name: Build Android APK
      script: |
        flutter build apk --release
        mv build/app/outputs/flutter-apk/app-release.apk output/AccionGPS-Manager.apk

    - &build_android_aab
      name: Build Android AAB
      script: |
        flutter build appbundle --release
        mv build/app/outputs/bundle/release/app-release.aab output/AccionGPS-Manager.aab

    - &build_ios_nosign
      name: Build iOS (no codesign)
      script: flutter build ipa --release --no-codesign

    # Xcode (IDESPMWorkspaceDelegate) intermittently crashes while resolving the
    # Flutter SwiftPM package graph on CI ("count of array (N) differs from count
    # of index set (N-1)"). The project still supports CocoaPods, so disable the
    # Swift Package Manager integration and build every plugin through pods.
    - &disable_spm
      name: Turn off Flutter Swift Package Manager integration
      script: flutter config --no-enable-swift-package-manager

    - &disable_spm_use_cocoapods
      name: Use CocoaPods instead of Swift Package Manager
      script: |
        set -e
        flutter config --no-enable-swift-package-manager
        printf 'http1.1\nretry 5\nconnect-timeout 30\n' >> "$HOME/.curlrc"
        cd ios
        attempt=1
        until pod install; do
          if [ "$attempt" -ge 3 ]; then
            echo "FATAL: pod install failed after 3 attempts."
            exit 1
          fi
          echo "pod install failed (attempt $attempt), retrying in 15s..."
          attempt=$((attempt + 1))
          sleep 15
        done
        cd ..
        flutter build ios --config-only
        if grep -q "XCLocalSwiftPackageReference" ios/Runner.xcodeproj/project.pbxproj; then
          echo "FATAL: Swift Package Manager reference still present in the Xcode project."
          exit 1
        fi
        echo "OK: Swift Package Manager integration removed, CocoaPods in use."

    # Apple rejected build 101 (Guideline 2.1) because a DEBUG build was uploaded:
    # a debug Flutter app ships kernel_blob.bin (JIT) and cannot start on a real
    # device, so it shows a Flutter error on launch. This guard fails the build
    # if that ever happens again.
    - &verify_release_ipa
      name: Verify IPA is a RELEASE (AOT) build
      script: |
        set -e
        IPA=$(ls build/ios/ipa/*.ipa | head -n 1)
        echo "Verifying: $IPA"
        unzip -l "$IPA" | grep -E "App.framework|kernel_blob" || true
        if unzip -l "$IPA" | grep -q "kernel_blob.bin"; then
          echo "FATAL: kernel_blob.bin found. This is a DEBUG build and Apple will reject it."
          exit 1
        fi
        if unzip -p "$IPA" "Payload/Runner.app/Info.plist" | grep -q "_dartVmService"; then
          echo "FATAL: debug-only NSBonjourServices/_dartVmService key found. This is a DEBUG build."
          exit 1
        fi
        echo "OK: release (AOT) build confirmed."

workflows:
  android-release:
    name: Android Release (APK + AAB)
    instance_type: linux
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - mkdir -p output
      - *install_dependencies
      - *build_android_apk
      - *build_android_aab
    artifacts:
      - output/AccionGPS-Manager.apk
      - output/AccionGPS-Manager.aab

  ios-release:
    name: iOS Test (no codesign)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - mkdir -p output
      - *install_dependencies
      - *disable_spm_use_cocoapods
      - *build_ios_nosign
      - *verify_release_ipa
    artifacts:
      - build/ios/ipa/*.ipa

  ios-upload:
    name: iOS Upload to App Store
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      groups:
        - ios_signing
      vars:
        BUNDLE_ID: org.acciongps.manager
    scripts:
      - mkdir -p output
      - *install_dependencies
      - *disable_spm_use_cocoapods
      - name: Set up keychain for code signing
        script: keychain initialize
      - name: Fetch signing files from App Store Connect
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Build iOS IPA (signed release)
        script: flutter build ipa --release --export-options-plist=/Users/builder/export_options.plist
      - *verify_release_ipa
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: true
        cancel_previous_submissions: true

  ios-simulator:
    name: iOS Simulator Preview
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - *install_dependencies
      - *disable_spm
      - |
        flutter build ios --simulator --debug
    artifacts:
      - build/ios/Debug-iphonesimulator/Runner.app
