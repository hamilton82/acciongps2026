definitions:
  scripts:
    - &install_dependencies
      name: Install dependencies
      script: flutter pub get

    - &build_android_apk
      name: Build Android APK
      script: |
        flutter build apk --release
        mv build/app/outputs/flutter-apk/app-release.apk output/AccionGPS-Manager.apk

    - &build_android_aab
      name: Build Android AAB
      script: |
        flutter build appbundle --release
        mv build/app/outputs/bundle/release/app-release.aab output/AccionGPS-Manager.aab

    - &build_ios_nosign
      name: Build iOS (no codesign)
      script: flutter build ipa --release --no-codesign

    - &build_ios_sign
      name: Build iOS IPA (signed)
      script: flutter build ipa --release

    # Apple rejected build 101 (Guideline 2.1) because a DEBUG build was uploaded:
    # a debug Flutter app ships kernel_blob.bin (JIT) and cannot start on a real
    # device, so it shows a Flutter error on launch. This guard fails the build
    # if that ever happens again.
    - &verify_release_ipa
      name: Verify IPA is a RELEASE (AOT) build
      script: |
        set -e
        IPA=$(ls build/ios/ipa/*.ipa | head -n 1)
        echo "Verifying: $IPA"
        unzip -l "$IPA" | grep -E "App.framework|kernel_blob" || true
        if unzip -l "$IPA" | grep -q "kernel_blob.bin"; then
          echo "FATAL: kernel_blob.bin found. This is a DEBUG build and Apple will reject it."
          exit 1
        fi
        if unzip -p "$IPA" "Payload/Runner.app/Info.plist" | grep -q "_dartVmService"; then
          echo "FATAL: debug-only NSBonjourServices/_dartVmService key found. This is a DEBUG build."
          exit 1
        fi
        echo "OK: release (AOT) build confirmed."

workflows:
  android-release:
    name: Android Release (APK + AAB)
    instance_type: linux
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - mkdir -p output
      - *install_dependencies
      - *build_android_apk
      - *build_android_aab
    artifacts:
      - output/AccionGPS-Manager.apk
      - output/AccionGPS-Manager.aab

  ios-release:
    name: iOS Test (no codesign)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - mkdir -p output
      - *install_dependencies
      - *build_ios_nosign
      - *verify_release_ipa
    artifacts:
      - build/ios/ipa/*.ipa

  ios-upload:
    name: iOS Upload to App Store
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      groups:
        - ios_signing
    scripts:
      - mkdir -p output
      - *install_dependencies
      - *build_ios_sign
      - *verify_release_ipa
    artifacts:
      - build/ios/ipa/*.ipa

  ios-simulator:
    name: iOS Simulator Preview
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - *install_dependencies
      - |
        flutter build ios --simulator --debug
    artifacts:
      - build/ios/Debug-iphonesimulator/Runner.app
